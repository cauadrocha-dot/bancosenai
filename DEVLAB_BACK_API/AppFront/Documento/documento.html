<!DOCTYPE Html> 
<html lang="pt-br">
<head>
    <meta charset="UTF-8" />
    <title> Gestão de Documentos - Banco Senai </title>
    <link rel="stylesheet" href="documento.css" />
</head>
<body>
    <h1>Gestão de documentos</h1>
    <div class="form-container">
     <input type="number" id="codigoCliente" placeholder="Código do Cliente" />
    <input type="file" id="arquivo" />
    <button id="btEnviar" onclick="enviarDocumento()">Enviar </button>
        <button id="btBuscar" onclick="listarDocumentos()">Buscar Documentos</button>
    </div>
   <table id="tabeloDocumentos">
       <thead>
           <tr>
               <th>Id</th>
               <th>Nome</th>
               <th>Extensão</th>
               <th>Ações</th>
           </tr>
           </thead>
           <tbody id="corpoTabela">
           </tbody>
      </table> 
    <script src="documento.js"></script>
</body>
</html>
